# R4-only subset of smart-on-fhir/smart-dev-sandbox. Image digests resolved
# 2026-09-10; see sandbox.md for provenance and the upgrade procedure.
services:
  r4:
    image: smartonfhir/hapi-5:r4-synthea@sha256:5ba5f4a10df4610f53fac05fbdc34b37d733ba1315e39fa6ef4685dc6dfeec95
    platform: linux/amd64
    environment:
      HOST: localhost
      PORT: "18404"
    ports:
      - "127.0.0.1:18404:8080"
    volumes:
      - r4-data:/usr/local/tomcat/target/database
    mem_limit: 2g
    cpus: 2
    command:
      - /bin/sh
      - -c
      - |
        envsubst < /tmp/hapi.properties.tpl > /config/hapi.properties
        envsubst < /tmp/server.xml > /usr/local/tomcat/conf/server.xml
        exec catalina.sh run

  launcher:
    image: smartonfhir/smart-launcher@sha256:6205aa295f1849598182bb97f7ddb982e23e78a212cfb1e33acd9b07e64fb538
    depends_on:
      - r4
      - patient-browser
    environment:
      NODE_ENV: production
      HOST: localhost
      LAUNCHER_PORT: "80"
      BASE_URL: http://localhost:18413
      LAUNCHER_BASE_URL: http://localhost:18413
      FHIR_SERVER_R4: http://localhost:18404/hapi-fhir-jpaserver/fhir
      FHIR_SERVER_R4_INTERNAL: http://r4:8080/hapi-fhir-jpaserver/fhir
      # The launcher requires these settings even for disabled releases.
      FHIR_SERVER_R2: http://127.0.0.1:9/disabled-r2
      FHIR_SERVER_R3: http://127.0.0.1:9/disabled-r3
      PICKER_CONFIG_R2: disabled
      PICKER_CONFIG_R3: disabled
      PICKER_CONFIG_R4: r4-local
      PICKER_ORIGIN: http://localhost:18412
      STU2_ENABLED: "0"
      STU3_ENABLED: "0"
      STU4_ENABLED: "1"
      DISABLE_SANDBOXES: "1"
      DISABLE_BACKEND_SERVICES: "1"
    ports:
      - "127.0.0.1:18413:80"

  patient-browser:
    image: smartonfhir/patient-browser@sha256:cc35336e9fe57bf702dde9fae609a5e2fa3ff21b4fc5ead9311bacefbb9bbca8
    platform: linux/amd64
    ports:
      - "127.0.0.1:18412:80"
    volumes:
      - ./patient-browser/r4-local.json5:/usr/share/nginx/html/config/r4-local.json5:ro

volumes:
  r4-data:
