worker_processes 1;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    error_log /dev/stderr;
    ssl_certificate /test-tls/cert.pem;
    ssl_certificate_key /test-tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_header_buffer_size 32k;
    large_client_header_buffers 4 32k;
    map $server_port $public_port {
        8443 @HTTPS_PORT@;
        8444 @MTLS_PORT@;
    }
    map "$server_port:$request_uri" $mtls_wrong_host {
        default "";
        ~^8443:/test-mtls true;
    }
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $public_port;
    proxy_set_header X-Forwarded-Uri $request_uri;
    proxy_set_header X-Ssl-Cipher $ssl_cipher;
    proxy_set_header X-Ssl-Protocol $ssl_protocol;
    proxy_set_header X-Ssl-Cert $ssl_client_cert;
    proxy_set_header X-Test-Mtls-Called-On-Wrong-Host $mtls_wrong_host;
    server {
        listen 8443 ssl;
        ssl_verify_client off;
        location / { proxy_pass http://server:8080; }
    }
    server {
        listen 8444 ssl;
        ssl_verify_client optional_no_ca;
        location / { proxy_pass http://server:8080; }
    }
}
