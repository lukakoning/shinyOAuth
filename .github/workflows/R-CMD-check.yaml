# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }}, ${{ matrix.config.testthat || 'current testthat' }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}
          # shinytest2 >= 0.5.0 requires testthat >= 3.3.1. Keep the
          # minimum-testthat job on the last compatible shinytest2 release.
          - {os: ubuntu-latest,   r: 'release', testthat: 'testthat@3.2.2', shinytest2: 'shinytest2@0.4.1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Run tests guarded by skip_on_cran() — security / timing / webfakes tests
      NOT_CRAN: true
      # Browser tests run in the Chrome-provisioned integration workflow.
      SHINYOAUTH_BROWSER_TESTS: false
      # Suppress NOTE about Chrome temp files left by chromote/shinytest2 tests
      _R_CHECK_THINGS_IN_TEMP_DIR_: false

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: r-lib/actions/setup-pandoc@6f6e5bc62fba3a704f74e7ad7ef7676c5c6a2590 # v2.11.4

      - uses: r-lib/actions/setup-r@6f6e5bc62fba3a704f74e7ad7ef7676c5c6a2590 # v2.11.4
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@6f6e5bc62fba3a704f74e7ad7ef7676c5c6a2590 # v2.11.4
        with:
          extra-packages: |
            any::rcmdcheck
            ${{ matrix.config.testthat || 'any::testthat' }}
            ${{ matrix.config.shinytest2 || 'any::shinytest2' }}
          needs: check

      - name: Verify minimum testthat dependency versions
        if: matrix.config.testthat != ''
        shell: Rscript {0}
        run: |
          stopifnot(
            packageVersion("testthat") == "3.2.2",
            packageVersion("shinytest2") == "0.4.1"
          )

      - uses: r-lib/actions/check-r-package@6f6e5bc62fba3a704f74e7ad7ef7676c5c6a2590 # v2.11.4
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
