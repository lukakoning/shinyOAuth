name: OpenID declared release matrix

on:
  schedule:
    - cron: "23 3 * * 2"
  workflow_dispatch:
    inputs:
      report_checks_only:
        description: Run report checker and matrix policy tests only
        type: boolean
        default: false
      provider_companions:
        description: Run the provider browser matrix at the same commit and attest the linked evidence
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      selections: ${{ steps.matrix.outputs.selections }}
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Test release report verification
        run: |
          python3 -B integration/openid/test-release-artifact.py -v
          python3 -B integration/openid/test-paired-evidence.py -v

      - name: Test provider archive replay in report-only runs
        if: ${{ inputs.report_checks_only && inputs.provider_companions }}
        run: python3 -B integration/oidc-provider/test-release-matrix.py -v

      - name: Set up R
        uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
        with:
          r-version: "4.5.1"
          use-public-rspm: true

      - name: Install report checker dependencies
        shell: Rscript {0}
        run: |
          packages <- c("jsonlite", "openssl", "processx")
          install.packages(packages, repos = Sys.getenv("RSPM"))
          stopifnot(all(vapply(packages, requireNamespace, logical(1), quietly = TRUE)))

      - name: Validate the committed selection matrix
        id: matrix
        shell: Rscript {0}
        run: |
          source("integration/openid/helper-environment.R")
          source("integration/openid/helper-suite.R")
          source("integration/openid/helper-release.R")
          matrix <- openid_release_matrix()
          selections <- jsonlite::toJSON(list(include = matrix[["selections"]]), auto_unbox = TRUE)
          cat("selections=", selections, "\n", sep = "", file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)

  selections:
    if: ${{ !inputs.report_checks_only }}
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare.outputs.selections) }}
    uses: ./.github/workflows/openid-conformance.yml
    with:
      profile: ${{ matrix.profile }}
      transport: ${{ matrix.transport }}

  provider:
    if: ${{ github.event_name == 'schedule' || (inputs.provider_companions && !inputs.report_checks_only) }}
    needs: prepare
    uses: ./.github/workflows/oidc-provider-release-matrix.yml

  aggregate:
    if: ${{ always() && !inputs.report_checks_only && needs.prepare.result == 'success' }}
    needs: [prepare, selections]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      evidence_id: ${{ steps.evidence.outputs.artifact-id }}
      evidence_digest: ${{ steps.evidence.outputs.artifact-digest }}
      evidence_attempt: ${{ steps.identity.outputs.attempt }}
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up R
        uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
        with:
          r-version: "4.5.1"
          use-public-rspm: true

      - name: Install report checker dependencies
        shell: Rscript {0}
        run: |
          packages <- c("jsonlite", "openssl", "processx")
          install.packages(packages, repos = Sys.getenv("RSPM"))
          stopifnot(all(vapply(packages, requireNamespace, logical(1), quietly = TRUE)))

      - name: Download reports from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: openid-client-*-evidence-attempt-${{ github.run_attempt }}
          path: integration/openid/.artifacts/release-inputs
          merge-multiple: false
          digest-mismatch: error

      - name: Check every declared selection at the selected revision
        shell: Rscript {0}
        run: |
          inputs <- list.files("integration/openid/.artifacts/release-inputs", pattern = "^evidence[.]json$", recursive = TRUE, full.names = TRUE)
          clients <- inputs[vapply(inputs, function(path) {
            report <- jsonlite::read_json(path)
            !is.null(report[["profile"]]) && !identical(report[["profile"]], "api")
          }, logical(1))]
          result <- processx::run(file.path(R.home("bin"), "Rscript"), c(
            "integration/openid/run-release-check.R", "--revision", Sys.getenv("GITHUB_SHA"),
            "--output", "integration/openid/.artifacts/release-summary.json", clients
          ), error_on_status = FALSE)
          cat(result[["stdout"]])
          cat(result[["stderr"]], file = stderr())
          if (result[["status"]] != 0L) stop("Declared release matrix evidence failed")

      - name: Verify preflight and API reports for each declared selection
        run: |
          python3 integration/openid/verify-release-artifact.py \
            --revision "$GITHUB_SHA" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --downloaded-reports integration/openid/.artifacts/release-inputs

      - name: Require every selection job to succeed
        if: ${{ always() && needs.selections.result != 'success' }}
        run: |
          echo "At least one declared selection job failed or was cancelled."
          exit 1

      - name: Retain original sanitized reports and aggregate summary
        if: always()
        id: evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openid-declared-matrix-evidence-attempt-${{ github.run_attempt }}
          path: |
            integration/openid/.artifacts/release-inputs/**/evidence.json
            integration/openid/.artifacts/release-summary.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'schedule' && 7 || 90 }}

      - name: Record the verified evidence attempt
        id: identity
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  paired_evidence:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.provider_companions && !inputs.report_checks_only }}
    needs: [aggregate, provider]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      evidence_digest: ${{ steps.evidence.outputs.artifact-digest }}
      evidence_attempt: ${{ steps.identity.outputs.attempt }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Bind the verified aggregates from this attempt
        env:
          OIDF_ID: ${{ needs.aggregate.outputs.evidence_id }}
          OIDF_DIGEST: ${{ needs.aggregate.outputs.evidence_digest }}
          OIDF_ATTEMPT: ${{ needs.aggregate.outputs.evidence_attempt }}
          PROVIDER_ID: ${{ needs.provider.outputs.evidence_id }}
          PROVIDER_DIGEST: ${{ needs.provider.outputs.evidence_digest }}
          PROVIDER_ATTEMPT: ${{ needs.provider.outputs.evidence_attempt }}
        run: python3 integration/openid/record-paired-evidence.py > paired-release-evidence.json
      - name: Retain the link between the two aggregates
        id: evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openid-provider-release-link-attempt-${{ github.run_attempt }}
          path: paired-release-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Record the verified evidence attempt
        id: identity
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  attest:
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.aggregate.result == 'success' && (!inputs.provider_companions || needs.paired_evidence.result == 'success') }}
    needs: [aggregate, paired_evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Require evidence from this attempt
        env:
          EVIDENCE_ATTEMPT: ${{ needs.aggregate.outputs.evidence_attempt }}
          EVIDENCE_DIGEST: ${{ needs.aggregate.outputs.evidence_digest }}
          PAIRED_ENABLED: ${{ inputs.provider_companions }}
          PAIRED_ATTEMPT: ${{ needs.paired_evidence.outputs.evidence_attempt }}
          PAIRED_DIGEST: ${{ needs.paired_evidence.outputs.evidence_digest }}
        run: |
          if [[ "$EVIDENCE_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" || ! "$EVIDENCE_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "A verified aggregate from this attempt is required. Re-run all jobs."
            exit 1
          fi
          if [[ "$PAIRED_ENABLED" == true ]] && [[ "$PAIRED_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" || ! "$PAIRED_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "A verified paired release link from this attempt is required. Re-run all jobs."
            exit 1
          fi

      - name: Attest the original aggregate ZIP
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: openid-declared-matrix-evidence-attempt-${{ github.run_attempt }}.zip
          subject-digest: sha256:${{ needs.aggregate.outputs.evidence_digest }}
          create-storage-record: false

      - name: Attest the paired release link ZIP
        if: ${{ inputs.provider_companions }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: openid-provider-release-link-attempt-${{ github.run_attempt }}.zip
          subject-digest: sha256:${{ needs.paired_evidence.outputs.evidence_digest }}
          create-storage-record: false
