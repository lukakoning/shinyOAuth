name: OpenID client conformance

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Client module selection
        type: choice
        default: smoke
        options:
          - smoke
          - basic
  pull_request:
    paths:
      - "R/**"
      - "DESCRIPTION"
      - "NAMESPACE"
      - ".Rbuildignore"
      - "integration/openid/**"
      - "integration/connections/tls-proxy.py"
      - ".github/workflows/openid-conformance.yml"
      - ".github/actions/setup-r-dependencies/**"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CURL_SSL_BACKEND: openssl
      NOT_CRAN: "true"
      OPENID_PROFILE: ${{ inputs.profile || 'smoke' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up R
        uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
        with:
          r-version: "4.5.1"
          use-public-rspm: true

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@2dbff04819ebbfd5c974947148805a825b8a07fd # v2.1.0

      - name: Install test dependencies
        uses: ./.github/actions/setup-r-dependencies
        with:
          extra-packages: |
            local::.
            any::testthat
            any::chromote
            any::callr
            any::withr
            any::processx
            any::httpuv
          cache-version: 1

      - name: Select Chrome
        run: echo "CHROMOTE_CHROME=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"

      - name: Check local prerequisites
        run: |
          docker compose version
          python3 --version

      - name: Verify pinned services, TLS and cleanup
        run: Rscript integration/openid/run-preflight.R

      - name: Check suite API and evidence validation
        run: Rscript integration/openid/run-tests.R --check-api

      - name: Run real browser client selection
        run: Rscript integration/openid/run-tests.R --profile "$OPENID_PROFILE" --transport sync

      - name: Upload sanitized reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openid-client-${{ env.OPENID_PROFILE }}-evidence
          path: |
            integration/openid/.artifacts/preflight-*/evidence.json
            integration/openid/.artifacts/api-*/evidence.json
            integration/openid/.artifacts/smoke-*/evidence.json
            integration/openid/.artifacts/basic-*/evidence.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
