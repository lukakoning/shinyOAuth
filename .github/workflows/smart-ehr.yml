name: SMART profile and EHR browser integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - R/**
      - inst/www/**
      - DESCRIPTION
      - NAMESPACE
      - integration/smart/**
      - integration/connections/helper-browser.R
      - .github/workflows/smart-ehr.yml
  push:
    branches: [main, master]
    paths:
      - R/**
      - inst/www/**
      - DESCRIPTION
      - NAMESPACE
      - integration/smart/**
      - integration/connections/helper-browser.R
      - .github/workflows/smart-ehr.yml

permissions:
  contents: read

jobs:
  ehr-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: r-lib/actions/setup-r@6f6e5bc62fba3a704f74e7ad7ef7676c5c6a2590 # v2.11.4
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@6f6e5bc62fba3a704f74e7ad7ef7676c5c6a2590 # v2.11.4
        with:
          extra-packages: |
            local::.
            any::testthat
            any::webfakes
            any::chromote
            any::callr
            any::withr
            any::mirai
            any::promises
            any::future
      - name: Test public SMART EHR launch, context and retention
        run: Rscript integration/smart/run-ehr-browser.R
      - name: Test all SMART registrations, launch modes, identity and refresh scopes
        run: Rscript integration/smart/run-profiles.R
      - name: Test long authorization POST across the SMART browser matrix
        run: Rscript integration/smart/run-profiles.R --post
      - name: Test ordinary OAuth authorization POST and retained connections
        run: Rscript integration/connections/run-tests.R --post
      - name: Upload sanitized fixture evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smart-ehr-browser-evidence
          path: |
            integration/smart/.artifacts/ehr-*/evidence.json
            integration/smart/.artifacts/profiles-*/evidence.json
            integration/connections/.artifacts/*/evidence.json
          include-hidden-files: true
          if-no-files-found: ignore
