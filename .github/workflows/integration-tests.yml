name: OAuth integration tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions: read-all

jobs:
  integration:
    name: Run integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NOT_CRAN: "true"
      CURL_SSL_BACKEND: openssl

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up R
        uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
        with:
          use-public-rspm: true

      - name: Set up Chrome (for shinytest2/chromote)
        id: setup-chrome
        uses: browser-actions/setup-chrome@2dbff04819ebbfd5c974947148805a825b8a07fd # v2.1.0

      - name: Query dependencies
        uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
        with:
          extra-packages: |
            local::.
            any::testthat
            any::webfakes
            any::xml2
            any::rvest
            any::shinytest2
            any::chromote
            any::callr
            any::withr
            any::promises
            any::future
            any::mirai
            any::processx
          cache-version: 1

      - name: Select Chrome for browser tests
        run: echo "CHROMOTE_CHROME=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"

      - name: Install this checkout for apps and mirai workers
        run: R CMD INSTALL .

      - name: Print session info (debug)
        run: |
          Rscript -e "sessionInfo()"

      - name: Run complete browser suite (zero skips)
        env:
          SHINYOAUTH_BROWSER_TESTS: true
          CHROMOTE_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          Rscript tests/run-browser-tests.R

      - name: Docker info (debug)
        run: |
          docker --version
          docker compose version || true

      - name: Test retained OAuth connections
        run: Rscript integration/connections/run-tests.R

      - name: Test OAuth authorization POST and retained connections
        run: Rscript integration/connections/run-tests.R --post

      - name: Test shared-issuer callbacks and resource isolation
        run: Rscript integration/connections/run-shared-router.R

      - name: Test retained refresh scope narrowing
        run: Rscript integration/connections/run-scope-narrowing.R

      - name: Test token target replacement and recovery
        run: Rscript integration/connections/run-targets.R

      - name: Test account login and retained authorization across sessions
        run: Rscript integration/connections/run-account.R

      - name: Run independent strict authorization-server fixture
        run: |
          python -m pip install -r integration/conformance/requirements.txt
          Rscript integration/conformance/run-tests.R

      - name: Run integration tests (Keycloak)
        env:
          # Ensure tests that skip on CRAN will run
          NOT_CRAN: true
          # Point chromote to the installed Chrome
          CHROMOTE_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
        shell: bash
        run: |
          bash integration/keycloak/run-integration.sh

      - name: Upload integration logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: keycloak-logs
          path: |
            integration/keycloak/.generated/keycloak-compose.log
            integration/keycloak/_snaps/**
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Upload sanitized retained-connection evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: connection-retention-evidence
          path: integration/connections/.artifacts/**/evidence.json
          include-hidden-files: true
          if-no-files-found: ignore
